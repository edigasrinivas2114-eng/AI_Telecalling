; Add this to /etc/asterisk/extensions.conf on your Asterisk box.
;
; Dial plan:
;   - Extension 1000 and 1001 can call each other directly (normal softphone-to-softphone).
;   - Either can dial 8000 to reach the AI. Change bridge_service.py's HOST:PORT
;     to match wherever that service actually runs (127.0.0.1 if same machine).

[from-softphone]
exten => 1000,1,Dial(PJSIP/1000,20)
 same => n,Hangup()

exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 8000,1,NoOp(Call to AI telecaller test line)
 same => n,Answer()
 same => n,Set(CALLERID(name)=AI Test Line)
 ; AudioSocket(<uuid>,<host>:<port>) requires an actual UUID-shaped string --
 ; generate a fresh one per call. The value doesn't need to mean anything to
 ; the bridge service, it's just how Asterisk identifies the call to it.
 same => n,Set(CALLUUID=${SHELL(uuidgen | tr -d '\n')})
 same => n,AudioSocket(${CALLUUID},127.0.0.1:8090)
 same => n,Hangup()
