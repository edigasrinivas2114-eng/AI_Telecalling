; Add this to /etc/asterisk/pjsip.conf (or pjsip.conf.d/) on your Asterisk box.
; Creates two SIP extensions for your two test softphones (Zoiper/Linphone).
; CHANGE THE PASSWORDS before using this anywhere reachable over a network.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; ---- Extension 1000 ----
[1000]
type=endpoint
context=from-softphone
disallow=all
allow=ulaw
allow=alaw
auth=1000-auth
aors=1000

[1000-auth]
type=auth
auth_type=userpass
password=changeme1000
username=1000

[1000]
type=aor
max_contacts=1

; ---- Extension 1001 ----
[1001]
type=endpoint
context=from-softphone
disallow=all
allow=ulaw
allow=alaw
auth=1001-auth
aors=1001

[1001-auth]
type=auth
auth_type=userpass
password=changeme1001
username=1001

[1001]
type=aor
max_contacts=1
